# ccache 配置文件
# 位置: ~/.ccache/ccache.conf

# 缓存目录
cache_dir = ~/.ccache

# 最大缓存大小 (5GB)
max_size = 5G

# 启用压缩以节省空间
compression = true
compression_level = 6

# 启用硬链接以节省空间
hard_link = true

# 详细输出级别 (0=静默, 1=错误, 2=警告, 3=信息, 4=调试)
verbose = 0

# 缓存统计信息
# log_file = ~/.ccache/ccache.log

# 启用依赖文件缓存
depend_mode = true

# 启用直接模式 (跳过依赖检查，更快但可能不准确)
direct_mode = true

# 启用预处理器模式
cpp_extension = true

# 启用编译器检查
compiler_check = mtime

# 启用哈希文件
hash_dir = false

# 启用 sloppiness (忽略某些不重要的差异)
sloppiness = file_macro,time_macros,include_file_mtime,include_file_ctime

# 启用统计信息
stats = true

# 启用缓存清理
cleanup = true
